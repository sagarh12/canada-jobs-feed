name: Update job feed

on:
  # The main schedule is an outside trigger (trigger/trigger.gs) that starts this workflow every
  # 10 minutes in "auto" mode: GitHub's own schedule runs far less often than asked when it's busy.
  # This one is only a backup.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:          # the outside trigger, or the "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "auto (full if the last full run was 28+ minutes ago, else quick), full or quick"
        default: auto

concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode || 'auto' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Start from the latest feed (another run may have just published)
        run: git pull --ff-only
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_years
      - run: python feed.py "$MODE"
      - name: Publish the new feed
        run: |
          git config user.name "canada-jobs-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git diff --cached --quiet && exit 0
          git commit -m "Update job feed ($(python -c 'import json; print(json.load(open("feed/status.json"))["mode"])'))"
          git pull --rebase -X theirs
          git push
      - name: Check every source still finds jobs
        run: python feed.py check
